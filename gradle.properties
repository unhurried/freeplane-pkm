# Project version, used both by the build and as the default add-on version
# (overridden by -PaddonVersion=..., e.g. from a git tag in CI).
version=0.13.0

# packageAddon builds the whole add-on (now tens of MB, once the search feature's
# bundled Lucene/PDFBox/POI jar is included) as a single base64-encoded XML string
# in memory; Gradle's default daemon heap is too small for that and fails with
# "Java heap space", especially when packageAddon runs in the same daemon JVM
# right after a build (e.g. `gradle build packageAddon`).
org.gradle.jvmargs=-Xmx2g
