// Files extracted into the user directory on installation (zip entry path -> project file).
def addonZipEntries = [
    'scripts/template.md'            : 'scripts/template.md',
    'scripts/find.search-ms.template': 'scripts/find.search-ms.template',
    'scripts/init/init.groovy'       : 'scripts/init/init.groovy',
]

