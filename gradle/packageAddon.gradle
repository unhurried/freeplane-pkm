// Escapes a string for use in an XML attribute value. Newlines and tabs must be
// written as character references ("&#xa;" etc.), otherwise the XML parser would
// normalize them to spaces - this is how Freeplane itself serializes node text.
static String escapeXmlAttr(String s) {
    s.replace('&', '&amp;')
     .replace('<', '&lt;')
     .replace('>', '&gt;')
     .replace('"', '&quot;')
     .replace('\r\n', '\n')
     .replace('\r', '\n')
     .replace('\n', '&#xa;')
     .replace('\t', '&#x9;')
}

static String base64Mime(byte[] bytes) {
    Base64.getMimeEncoder(76, '\n'.getBytes('US-ASCII')).encodeToString(bytes)
}

static byte[] zipBytes(Map<String, File> entries) {
    def baos = new ByteArrayOutputStream()
    new ZipOutputStream(baos).withCloseable { zos ->
        def dirs = new TreeSet<String>()
        entries.keySet().each { path ->
            def dir = ''
            path.tokenize('/').init().each { seg -> dir += seg + '/'; dirs << dir }
        }
        dirs.each { zos.putNextEntry(new ZipEntry(it)); zos.closeEntry() }
        entries.each { path, file ->
            def entry = new ZipEntry(path)
            entry.time = file.lastModified()
            zos.putNextEntry(entry)
            zos << file.bytes
            zos.closeEntry()
        }
    }
    baos.toByteArray()
}

tasks.register('packageAddon') {
    group = 'distribution'
    description = 'Packages the project as a Freeplane add-on (*.addon.mm).'

    dependsOn tasks.named('jar')
    inputs.dir file('scripts')
    inputs.file tasks.named('jar').flatMap { it.archiveFile }
    inputs.property 'addonVersion', providers.gradleProperty('addonVersion').orElse(project.version.toString())
    outputs.dir layout.buildDirectory.dir('addon')

    doLast {
        def version = (project.findProperty('addonVersion') ?: project.version).toString().trim()
        if (!version.startsWith('v')) version = 'v' + version

        def scriptsDir = file('scripts')

        // Safety check: every top-level script must be declared in addonScriptDefs.
        def actualScripts = scriptsDir.listFiles().findAll { it.file && it.name.endsWith('.groovy') }*.name as Set
        def declaredScripts = addonScriptDefs*.file as Set
        if (actualScripts != declaredScripts) {
            throw new GradleException("Scripts in scripts/ and addonScriptDefs are out of sync.\n" +
                "  missing in defs: ${actualScripts - declaredScripts}\n" +
                "  missing in scripts/: ${declaredScripts - actualScripts}")
        }

        // lib/*.groovy is compiled into a jar (see build.gradle: sourceSets.main.groovy.srcDirs
        // = ['lib']); the jar - not the raw sources - is what goes on the add-on's classpath.
        def libFiles = [tasks.jar.archiveFile.get().asFile]
        def zipEntryFiles = addonZipEntries.collectEntries { path, projectPath ->
            def f = file(projectPath)
            if (!f.file) throw new GradleException("Missing file for zip entry: $projectPath")
            [(path): f]
        }

        def esc = { s -> escapeXmlAttr(s?.toString() ?: '') }
        def xml = new StringBuilder()
        def line = { s -> xml.append(s).append('\n') }

        line '<map version="freeplane 1.11.1">'
        line '<!--To view this file, download free mind mapping software Freeplane from https://www.freeplane.org -->'
        line "<node TEXT=\"${esc(addonDisplayName)}\" FOLDED=\"false\" LINK=\"${esc(addonHomepage)}\">"
        line "<attribute NAME=\"name\" VALUE=\"${esc(addonName)}\"/>"
        line "<attribute NAME=\"version\" VALUE=\"${esc(version)}\"/>"
        line "<attribute NAME=\"author\" VALUE=\"${esc(addonAuthor)}\"/>"
        line "<attribute NAME=\"freeplaneVersionFrom\" VALUE=\"${esc(addonFreeplaneVersionFrom)}\"/>"
        line '<attribute NAME="freeplaneVersionTo" VALUE=""/>'
        line '<attribute NAME="updateUrl" VALUE=""/>'
        def downloadUrl = "${addonHomepage}/releases/download/${version}/freeplane-pkm-${version}.addon.mm"
        line "<attribute NAME=\"downloadUrl\" VALUE=\"${esc(downloadUrl)}\"/>"

        line '<node TEXT="description" FOLDED="true">'
        line "<node TEXT=\"${esc(addonDescription)}\"/>"
        line '</node>'

        line '<node TEXT="changes" FOLDED="true">'
        line "<node TEXT=\"${esc(version)}\">"
        line '<node TEXT="See the project homepage for the change history."/>'
        line '</node>'
        line '</node>'

        line '<node TEXT="license" FOLDED="true">'
        line "<node TEXT=\"${esc(addonLicense)}\"/>"
        line '</node>'
        line '<node TEXT="preferences.xml" FOLDED="true"/>'
        line '<node TEXT="default.properties" FOLDED="true"/>'

        line '<node TEXT="translations" FOLDED="true">'
        line '<node TEXT="en">'
        line "<attribute NAME=\"addons.\${name}\" VALUE=\"${esc(addonDisplayName)}\"/>"
        addonScriptDefs.each { def scriptBase = it.file - '.groovy'
            line "<attribute NAME=\"addons.\${name}.${esc(scriptBase)}\" VALUE=\"${esc(it.title)}\"/>"
        }
        line '</node>'
        line '</node>'

        line '<node TEXT="deinstall" FOLDED="true">'
        line '<attribute NAME="delete" VALUE="${installationbase}/addons/${name}.script.xml"/>'
        addonScriptDefs.each {
            line "<attribute NAME=\"delete\" VALUE=\"\${installationbase}/addons/\${name}/scripts/${esc(it.file)}\"/>"
        }
        libFiles.each {
            line "<attribute NAME=\"delete\" VALUE=\"\${installationbase}/addons/\${name}/lib/${esc(it.name)}\"/>"
        }
        addonZipEntries.keySet().each {
            line "<attribute NAME=\"delete\" VALUE=\"\${installationbase}/${esc(it)}\"/>"
        }
        line '</node>'

        line '<node TEXT="scripts" FOLDED="true">'
        addonScriptDefs.each { def d ->
            def scriptBase = d.file - '.groovy'
            line "<node TEXT=\"${esc(d.file)}\" FOLDED=\"true\">"
            line "<attribute NAME=\"menuTitleKey\" VALUE=\"addons.\${name}.${esc(scriptBase)}\"/>"
            line "<attribute NAME=\"menuLocation\" VALUE=\"main_menu_scripting/${esc(addonName)}\"/>"
            line "<attribute NAME=\"executionMode\" VALUE=\"${esc(d.mode)}\"/>"
            line "<attribute NAME=\"keyboardShortcut\" VALUE=\"${esc(d.shortcut)}\"/>"
            line '<attribute NAME="execute_scripts_without_asking" VALUE="true"/>'
            line '<attribute NAME="execute_scripts_without_file_restriction" VALUE="true"/>'
            line '<attribute NAME="execute_scripts_without_write_restriction" VALUE="true"/>'
            line "<attribute NAME=\"execute_scripts_without_exec_restriction\" VALUE=\"${d.exec}\"/>"
            line '<attribute NAME="execute_scripts_without_network_restriction" VALUE="false"/>'
            line "<node TEXT=\"${esc(new File(scriptsDir, d.file).getText('UTF-8'))}\"/>"
            line '</node>'
        }
        line '</node>'

        line '<node TEXT="zips" FOLDED="true">'
        line '<node TEXT="scripts" FOLDED="true">'
        line "<node TEXT=\"${esc(base64Mime(zipBytes(zipEntryFiles)))}\"/>"
        line '</node>'
        line '</node>'

        line '<node TEXT="lib" FOLDED="true">'
        libFiles.each {
            line "<node TEXT=\"${esc(it.name)}\" FOLDED=\"true\">"
            line "<node TEXT=\"${esc(base64Mime(it.bytes))}\"/>"
            line '</node>'
        }
        line '</node>'

        line '<node TEXT="images" FOLDED="true"/>'
        line '</node>'
        line '</map>'

        def outDir = layout.buildDirectory.dir('addon').get().asFile
        outDir.deleteDir()
        outDir.mkdirs()
        def addonFile = new File(outDir, "freeplane-pkm-${version}.addon.mm")
        addonFile.setText(xml.toString(), 'UTF-8')

        new File(outDir, 'version.properties').text = """version=${version}
downloadUrl=${downloadUrl}
freeplaneVersionFrom=${addonFreeplaneVersionFrom}
"""
        logger.lifecycle("Created ${addonFile}")
    }
}
