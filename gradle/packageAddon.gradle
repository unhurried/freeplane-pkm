    [file: 'NewPage.groovy',                 title: 'New Page',                   mode: 'on_selected_node', shortcut: 'F9',  exec: true],
    [file: 'NewDirectory.groovy',            title: 'New Directory',              mode: 'on_selected_node', shortcut: 'F10', exec: true],
    [file: 'Delete.groovy',                  title: 'Delete',                     mode: 'on_selected_node', shortcut: 'F12', exec: false],
    [file: 'AddAssets.groovy',               title: 'Add Assets',                 mode: 'on_single_node',   shortcut: '',    exec: false],
    [file: 'AddToToDo.groovy',               title: 'Add to ToDo',                mode: 'on_selected_node', shortcut: 'F7',  exec: false],
    [file: 'ShowToDo.groovy',                title: 'Show ToDo',                  mode: 'on_single_node',   shortcut: '',    exec: false],
    [file: 'UpdateNextSteps.groovy',         title: 'Update Next Steps',          mode: 'on_selected_node', shortcut: 'F8',  exec: false],
    [file: 'Filter.groovy',                  title: 'Filter',                     mode: 'on_selected_node', shortcut: 'F5',  exec: false],
    [file: 'FindUnlinked.groovy',            title: 'Find Unlinked',              mode: 'on_single_node',   shortcut: '',    exec: false],
    [file: 'SearchWithInazumaSearch.groovy', title: 'Search with InazumaSearch',  mode: 'on_selected_node', shortcut: 'F6',  exec: true],
    [file: 'SearchWithWindowsSearch.groovy', title: 'Search with Windows Search', mode: 'on_single_node',   shortcut: '',    exec: true],
