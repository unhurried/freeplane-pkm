// Packages the project as a Freeplane add-on (*.addon.mm).
//
// This task replicates what the Freeplane devtools add-on (checkAddOn.groovy +
// releaseAddOn.groovy) does, without requiring a running Freeplane instance:
//  - scripts/*.groovy are embedded as script nodes (source code in a child node)
//  - lib/*.groovy is compiled into a jar (via the standard Gradle `jar` task) and
//    embedded base64-encoded under the "lib" node (installed to
//    <userdir>/addons/<name>/lib, which is added to the add-on's script classpath).
//    Per Freeplane's add-on docs, the lib node is for binary files (jars); a raw
//    .groovy source file placed there is not compiled or added to the classpath,
//    so classes it defines (e.g. Utils) would fail to resolve from addon scripts.
//  - scripts/template.md, scripts/find.search-ms.template and scripts/init/init.groovy
//    are packed into a zip under the "zips" node (extracted into <userdir>, so the
//    scripts keep finding them at <userdir>/scripts/...)

import java.util.zip.ZipEntry
import java.util.zip.ZipOutputStream

def addonName = 'freeplanePkm'
def addonDisplayName = 'Freeplane PKM'
def addonAuthor = 'unhurried'
def addonHomepage = 'https://github.com/unhurried/freeplane-pkm'
