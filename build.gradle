plugins {
    id 'groovy'
    id 'codenarc'
    id 'com.gradleup.shadow' version '8.3.5'
}

apply from: 'gradle/packageAddon.gradle'

repositories {
    mavenCentral()
}

// Pinned so the compiled class file version stays loadable by Freeplane's bundled
// JRE regardless of which JDK happens to run Gradle (e.g. a devcontainer update).
// Must stay in sync with the java-version used in .github/workflows/package-addon.yml.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        groovy {
            srcDirs = ['lib']
        }
    }
    test {
        groovy {
            srcDirs = ['test']
        }
    }
}

// Static analysis for lib/ and test/ only (via the sourceSets above) - not
// scripts/, which relies on Freeplane-injected bindings (node, c, ui) that
// look like undefined variables to a rule-based linter. See
// config/codenarc/rules.groovy for the (deliberately small) rule set.
codenarc {
    toolVersion = '3.4.0'
    configFile = file('config/codenarc/rules.groovy')
}

dependencies {
    // Groovy itself is not bundled into the add-on's lib jar (see shadowJar below) -
    // Freeplane already runs on its own embedded Groovy, which provides these classes
    // at runtime. compileOnly keeps it available for compiling lib/*.groovy without
    // shadowJar packaging a second, potentially conflicting, copy.
    compileOnly 'org.apache.groovy:groovy:4.0.27'

    // Full-text search: index (Lucene) plus content extraction for non-Markdown
    // formats (PDF, and current-format Office documents). These, unlike Groovy, are
    // not provided by the Freeplane runtime, so they are bundled by shadowJar into
    // the add-on's lib jar.
    implementation 'org.apache.lucene:lucene-core:9.11.1'
    implementation 'org.apache.lucene:lucene-analysis-common:9.11.1'
    implementation 'org.apache.lucene:lucene-highlighter:9.11.1'
    // Japanese morphological analysis (Kuromoji), including its bundled IPADIC
    // dictionary - used for Japanese content/filename search (see SearchIndex.groovy).
    implementation 'org.apache.lucene:lucene-analysis-kuromoji:9.11.1'
    implementation 'org.apache.pdfbox:pdfbox:2.0.31'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    testImplementation 'org.apache.groovy:groovy:4.0.27'
    // Freeplane runs the add-on on a full Groovy distribution, so scripts/*.groovy may
    // use its extension modules (e.g. Date.format() in NewPage.groovy, LocalDate.format()
    // parsing in Filter.groovy). Compiling lib/ only needs groovy core, so the modules
    // the script specs exercise are added to the test runtime instead.
    testImplementation 'org.apache.groovy:groovy-dateutil:4.0.27'
    testImplementation 'org.apache.groovy:groovy-datetime:4.0.27'
    testImplementation platform('org.spockframework:spock-bom:2.4-M4-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testRuntimeOnly 'net.bytebuddy:byte-buddy:1.17.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Produces the fat jar embedded in the add-on (see gradle/packageAddon.gradle):
// lib/*.groovy classes plus the search dependencies above, minus Groovy itself
// (compileOnly, so shadowJar's runtime classpath never includes it). Keeps its
// default "-all" classifier so its output file doesn't collide with the plain
// `jar` task's (both would otherwise write build/libs/freeplane-pkm-<version>.jar).
tasks.named('shadowJar') {
    // lucene-core is a multi-release JAR: MMapDirectory's Java 19+ implementation
    // (MemorySegmentIndexInputProvider) lives only under META-INF/versions/19+/, not
    // in the base class tree. shadowJar merges those versioned .class files into the
    // fat jar but, unlike the `jar` task, does not carry over the source jars'
    // "Multi-Release: true" manifest attribute. Without it the JVM ignores
    // META-INF/versions/ entirely and treats the fat jar as a plain (non-multi-release)
    // jar, so on Java 19+ (e.g. Freeplane's bundled JRE) MMapDirectory's static
    // initializer fails to find MemorySegmentIndexInputProvider at all, throwing
    // ClassNotFoundException -> LinkageError. Restoring the attribute here makes the
    // JVM look under META-INF/versions/ again, as it does for the unshaded jar.
    manifest {
        attributes 'Multi-Release': 'true'
    }
}

test {
    useJUnitPlatform()
    // ScriptSpec subclasses and ScriptSyntaxSpec read scripts/*.groovy directly off
    // disk at run time (Freeplane runs them as files, not compiled classes - see
    // CLAUDE.md), so Gradle's own up-to-date check - which otherwise only looks at
    // the test task's compiled classes/classpath - needs telling that this task
    // also depends on that directory's contents.
    inputs.dir file('scripts')
    // updateNextSteps() marshals node updates onto the Swing EDT; running headless
    // lets that AWT event queue start on machines/CI runners without a display.
    systemProperty 'java.awt.headless', 'true'
    // The JVM hardcodes java.io.tmpdir to /tmp and ignores $TMPDIR, so @TempDir-based
    // tests fail wherever /tmp itself isn't writable (e.g. Claude Code's sandboxed
    // shell, which only allows writes under $TMPDIR). Forward it through when set.
    if (System.getenv('TMPDIR')) {
        systemProperty 'java.io.tmpdir', System.getenv('TMPDIR')
    }

    // A failure Gradle cannot render (e.g. a test fake whose toString() recurses -
    // see the testing policy in CLAUDE.md) makes its JUnit listener throw while
    // reporting, which silently downgrades the failed test to "skipped" and leaves
    // the build green. Nothing here is meant to be skipped, so treat it as a failure.
    def skippedTests = []
    addTestListener(new TestListener() {
        void beforeSuite(TestDescriptor suite) {}
        void afterSuite(TestDescriptor suite, TestResult result) {}
        void beforeTest(TestDescriptor testDescriptor) {}
        void afterTest(TestDescriptor descriptor, TestResult result) {
            if (result.resultType == TestResult.ResultType.SKIPPED) {
                skippedTests << "${descriptor.className}.${descriptor.name}"
            }
        }
    })
    doLast {
        if (skippedTests) {
            throw new GradleException("Tests were skipped instead of run: ${skippedTests.join(', ')}")
        }
    }
}

// Runs tools/check-conventions.sh - the machine-checkable half of CLAUDE.md's
// conventions (script/spec/addonScriptDefs sync, no direct Desktop use in
// scripts/, no silently skipped tests, Java version sync). Kept as a plain
// Exec (no JVM, no declared inputs/outputs) rather than a Spock spec so it
// stays fast enough to also run from the PostToolUse hook in
// .claude/settings.json on every scripts/lib/test edit, not just at `gradle
// check` time.
tasks.register('checkConventions', Exec) {
    group = 'verification'
    description = "Runs tools/check-conventions.sh (the machine-readable half of CLAUDE.md)."
    commandLine 'bash', 'tools/check-conventions.sh'
}

tasks.named('check') {
    dependsOn 'checkConventions'
}
