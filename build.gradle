plugins {
    id 'groovy'
    id 'codenarc'
    id 'com.gradleup.shadow' version '8.3.5'
}

apply from: 'gradle/packageAddon.gradle'

repositories {
    mavenCentral()
}

// Pinned so the class files stay loadable by Freeplane's bundled JRE whatever
// JDK runs Gradle. Keep in sync with java-version in .github/workflows/package-addon.yml.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        groovy {
            srcDirs = ['lib']
        }
    }
    test {
        groovy {
            srcDirs = ['test']
        }
    }
}

// lib/ and test/ only: scripts/ relies on Freeplane-injected bindings (node, c, ui)
// that a linter sees as undefined variables.
codenarc {
    toolVersion = '3.4.0'
    configFile = file('config/codenarc/rules.groovy')
}

dependencies {
    // Freeplane runs on its own embedded Groovy, so it is not bundled into the add-on jar.
    compileOnly 'org.apache.groovy:groovy:4.0.27'

    // Full-text search: index (Lucene, with Kuromoji for Japanese) plus content
    // extraction for PDF and current-format Office documents. Bundled by shadowJar.
    implementation 'org.apache.lucene:lucene-core:9.11.1'
    implementation 'org.apache.lucene:lucene-analysis-common:9.11.1'
    implementation 'org.apache.lucene:lucene-highlighter:9.11.1'
    implementation 'org.apache.lucene:lucene-analysis-kuromoji:9.11.1'
    implementation 'org.apache.pdfbox:pdfbox:2.0.31'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    testImplementation 'org.apache.groovy:groovy:4.0.27'
    // Extension modules the scripts use (Date.format(), LocalDate parsing); Freeplane's
    // full Groovy distribution provides them at runtime.
    testImplementation 'org.apache.groovy:groovy-dateutil:4.0.27'
    testImplementation 'org.apache.groovy:groovy-datetime:4.0.27'
    testImplementation platform('org.spockframework:spock-bom:2.4-M4-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testRuntimeOnly 'net.bytebuddy:byte-buddy:1.17.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The fat jar embedded in the add-on: lib/ classes plus the dependencies above.
tasks.named('shadowJar') {
    // lucene-core is a multi-release jar (MMapDirectory's Java 19+ implementation
    // lives under META-INF/versions/19/). shadowJar copies those classes but drops
    // this manifest attribute, without which the JVM ignores them and MMapDirectory
    // fails to initialize on Freeplane's bundled JRE.
    manifest {
        attributes 'Multi-Release': 'true'
    }
}

test {
    useJUnitPlatform()
    // The script specs read scripts/*.groovy off disk, so those files are inputs too.
    inputs.dir file('scripts')
    // Lets the Swing EDT (used by Utils.updateAllNextSteps) start without a display.
    systemProperty 'java.awt.headless', 'true'
    // SearchIndexSpec creates files with Japanese names; under a non-UTF-8 locale
    // (common in containers/CI) the JVM writes them as '?'. Windows uses a code page
    // this variable wouldn't affect.
    def jnuEncoding = System.getProperty('sun.jnu.encoding') ?: ''
    def onWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    if (!onWindows && !jnuEncoding.toUpperCase().contains('UTF')) {
        environment 'LC_ALL', 'C.UTF-8'
    }
    // The JVM ignores $TMPDIR; forward it so @TempDir works where /tmp isn't writable.
    if (System.getenv('TMPDIR')) {
        systemProperty 'java.io.tmpdir', System.getenv('TMPDIR')
    }

    // A failure Gradle can't render (e.g. a fake whose toString() recurses) makes
    // the JUnit listener throw mid-report and records the test as skipped, leaving
    // the build green. Nothing here is meant to be skipped.
    def skippedTests = []
    addTestListener(new TestListener() {
        void beforeSuite(TestDescriptor suite) {}
        void afterSuite(TestDescriptor suite, TestResult result) {}
        void beforeTest(TestDescriptor testDescriptor) {}
        void afterTest(TestDescriptor descriptor, TestResult result) {
            if (result.resultType == TestResult.ResultType.SKIPPED) {
                skippedTests << "${descriptor.className}.${descriptor.name}"
            }
        }
    })
    doLast {
        if (skippedTests) {
            throw new GradleException("Tests were skipped instead of run: ${skippedTests.join(', ')}")
        }
    }
}

tasks.register('checkConventions', Exec) {
    group = 'verification'
    description = 'Runs tools/check-conventions.sh (the machine-checkable conventions from CLAUDE.md).'
    commandLine 'bash', 'tools/check-conventions.sh'
}

tasks.named('check') {
    dependsOn 'checkConventions'
}
